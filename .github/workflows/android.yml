# Сборка APK: при каждом push и вручную. Готовые APK — в артефактах запуска; новая версия на main сразу выходит релизом.
name: android
on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Сборка
        run: gradle --no-daemon assembleRelease

      - name: Имена файлов
        run: |
          mkdir out
          for f in app/build/outputs/apk/release/*.apk; do
            n=$(basename "$f" | sed 's/^app-//; s/-release//; s/-unsigned//')
            cp "$f" "out/Zapret-$n"
          done
          ls -la out

      - uses: actions/upload-artifact@v4
        with:
          name: zapret-android
          path: out/*.apk

      # новая версия (versionName в app/build.gradle.kts) на main → релиз vX.Y.Z с APK; уже выпущенная — не трогаем
      - name: Релиз новой версии
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VER=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          if gh release view "v$VER" >/dev/null 2>&1; then echo "v$VER уже выпущена"; exit 0; fi
          gh release create "v$VER" out/*.apk --target "$GITHUB_SHA" --title "Zapret для Android v$VER" \
            --notes "Ставь **Zapret-universal.apk** — подходит для любого телефона. Новые версии ставятся поверх старой."
